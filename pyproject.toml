[project]
name = "proton-mail-mcp"
version = "0.1.0"
description = "Unofficial read-only Proton Mail connector (MCP server + bulk export) via Proton Mail Bridge IMAP"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "imapclient>=3.0.1",
    "python-dotenv>=1.0.1",
    # OCR/Vision: PDF-Text + Rendern (pymupdf), OCR (pytesseract -> System-tesseract), Bilder (pillow)
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.4",
]

[project.scripts]
proton-check = "proton_mail.scripts.check_connection:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proton_mail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
